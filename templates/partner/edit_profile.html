<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Partner Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
padding-bottom:40px;
}

.header{
background:linear-gradient(135deg,#2563eb,#0f172a);
padding:30px;
color:white;
text-align:center;
border-radius:0 0 25px 25px;
}

.card{
margin:20px;
padding:20px;
background:white;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.photo{
width:120px;
height:120px;
margin:auto;
margin-bottom:15px;
border-radius:50%;
background:#eee;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
}

.file{
margin-bottom:20px;
}

.input{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:15px;
outline:none;
}

.input[readonly]{
background:#f3f4f6;
color:#666;
cursor:not-allowed;
}

textarea{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:15px;
resize:none;
height:90px;
outline:none;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:17px;
cursor:pointer;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<h2>

Edit Profile

</h2>

</div>

<div class="card">

<form
method="POST"
enctype="multipart/form-data">

<div class="photo">

{% if partner["profile_photo"] %}

<img src="{{ url_for('static', filename='uploads/' + partner['profile_photo']) }}">

{% else %}

🤝

{% endif %}

</div>

<input
class="file"
type="file"
name="profile_photo">

<input
class="input"
type="text"
name="company_name"
value="{{ partner['company_name'] or '' }}"
readonly>

<input
class="input"
type="text"
name="fullname"
value="{{ partner['fullname'] }}"
required>

<input
class="input"
type="email"
name="email"
value="{{ partner['email'] }}"
required>

<input
class="input"
type="text"
name="mobile"
value="{{ partner['mobile'] }}"
required>

<textarea
name="address"
placeholder="Address">{{ partner["address"] or "" }}</textarea>

<input
class="input"
type="text"
name="city"
value="{{ partner['city'] or '' }}"
placeholder="City">

<input
class="input"
type="text"
name="state"
value="{{ partner['state'] or '' }}"
placeholder="State">

<input
class="input"
type="text"
name="pincode"
value="{{ partner['pincode'] or '' }}"
placeholder="Pincode">

<button>

💾 Save Changes

</button>

</form>

</div>

</body>

</html>
