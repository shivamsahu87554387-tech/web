<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partner Jobs</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
padding-bottom:90px;
}

.header{

background:linear-gradient(135deg,#2563eb,#0f172a);

padding:25px;

color:white;

border-radius:0 0 25px 25px;

}

.add{

margin:20px;

}

.add button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#2563eb;

color:white;

font-size:17px;

cursor:pointer;

}

.job{

margin:15px;

background:white;

padding:18px;

border-radius:18px;

box-shadow:0 5px 12px rgba(0,0,0,.08);

}

.service{

font-size:20px;

font-weight:bold;

margin-bottom:10px;

}

.info{

margin-bottom:8px;

color:#555;

}

.status{

display:inline-block;

padding:6px 12px;

border-radius:20px;

background:#fff7cc;

color:#b8860b;

font-size:13px;

margin-top:10px;

}

.buttons{

display:flex;

gap:10px;

margin-top:15px;

}

.buttons a{

flex:1;

text-decoration:none;

}

button{

width:100%;

padding:12px;

border:none;

border-radius:10px;

cursor:pointer;

}

.details{

background:#2563eb;

color:white;

}

.call{

background:#22c55e;

color:white;

}

.empty{

margin:20px;

padding:40px;

background:white;

text-align:center;

border-radius:15px;

color:#777;

box-shadow:0 5px 12px rgba(0,0,0,.08);

}

.bottom{

position:fixed;

bottom:0;

left:0;

width:100%;

height:70px;

background:white;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:0 -5px 15px rgba(0,0,0,.08);

}

.bottom a{

text-decoration:none;

color:#555;

font-size:14px;

text-align:center;

}

.active{

color:#2563eb;

font-weight:bold;

}

</style>

</head>

<body>

<div class="header">

<h2>

💼 My Jobs

</h2>

<p>

view your jobs

</p>

</div>


{% for job in jobs %}

<div class="job">

<div class="service">

{{ job["service"] }}

</div>

<div class="info">

👤 {{ job["customer_name"] }}

</div>

<div class="info">

📱 {{ job["customer_mobile"] }}

</div>



<div class="info">

📅 {{ job["booking_date"] }}

</div>

<div class="info">

🕒 {{ job["booking_time"] }}

</div>

<div class="status">

{{ job["job_status"] }}

</div>

<div class="buttons">

<a href="/partner/job/{{ job['job_id'] }}">

<button class="details">

View Details

</button>

</a>

<a href="tel:{{ job['customer_mobile'] }}">

<button class="call">

📞 Customer

</button>

</a>

</div>

</div>

{% else %}

<div class="empty">

No Jobs found

</div>

{% endfor %}

<div class="bottom">

<a href="/partner/home">

🏠<br>Home

</a>

<a href="/partner/workers">

👷<br>Workers

</a>

<a class="active" href="/partner/jobs">

💼<br>Jobs

</a>

<a href="/partner/wallet">
💰<br>Wallet
</a>


<a href="/partner/profile">

👤<br>Profile

</a>

</div>

</body>

</html>
