<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#2563eb,#0f172a);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:380px;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:10px;
}

p{
text-align:center;
color:#666;
margin-bottom:25px;
font-size:14px;
}

.input{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:15px;
outline:none;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

.back{
display:block;
text-align:center;
margin-top:15px;
text-decoration:none;
color:#2563eb;
}

.flash{
padding:12px;
margin-bottom:15px;
border-radius:10px;
text-align:center;
color:white;
}

.success{
background:#22c55e;
}

.danger{
background:#ef4444;
}
</style>

</head>

<body>

<div class="card">

<h2>Forgot Password</h2>

<p>
Enter your registered Email
</p>
{% with messages=get_flashed_messages(with_categories=true) %}
{% if messages %}

<div class="flash {{ messages[0][0] }}">
{{ messages[0][1] }}
</div>

{% endif %}
{% endwith %}

<form method="POST">

<input
class="input"
type="email"
name="email"
placeholder="Registered Email"
required>

<button type="submit">

Send OTP

</button>

</form>

<a class="back" href="/login">

Back to Login

</a>

</div>

<script>

setTimeout(function(){

let flash=document.querySelector(".flash");

if(flash){

flash.style.transition="0.5s";
flash.style.opacity="0";

setTimeout(function(){

flash.remove();

},500);

}

},3000);

</script>

</body>
</html>
