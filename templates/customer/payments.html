<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment | WorkMitra</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #111827;

        }

        .header {
            background: #ffffff;

            align-items: center;

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            border: none;
            background: #f3f4f6;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        .header h1 {
            font-size: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #6b7280;
            font-size: 14px;
        }

        .value {
            font-size: 14px;
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }

        .total {
            font-size: 20px;

        .payment-option:hover {
            border-color: #111827;

        .payment-option.active {
            border-color: #111827;

        .payment-option input {
            margin-right: 10px;

            width: 100%;

            .container {

    </style>
</head>

<body>

<header class="header">
    <button class="back-btn" onclick="goBack()">‹</button>
    <h1>Payment</h1>
</header>

<main class="container">

    <div id="errorMessage" class="message"></div>

    <!-- Booking Summary -->
    <section class="card">
        <h2>Booking Summary</h2>

        <div class="row">
            <span class="label">Service</span>
            <span class="value" id="serviceName">-</span>
        </div>

        <div class="row">
            <span class="label">Date</span>
            <span class="value" id="bookingDate">-</span>
        </div>

        <div class="row">
            <span class="label">Time</span>
            <span class="value" id="bookingTime">-</span>
        </div>

        <div class="row">
            <span class="label">Address</span>
            <span class="value" id="bookingAddress">-</span>
        </div>
    </section>

    <!-- Amount -->
    <section class="card">
        <h2>Payment Details</h2>

        <div class="row">
            <span class="label">Service Charge</span>
            <span class="value" id="serviceFee">₹0</span>
        </div>

        <div class="row">
            <span class="label">Platform Fee</span>
            <span class="value" id="platformFee">₹0</span>
        </div>

        <div class="row">
            <span class="label">Total Amount</span>
            <span class="total" id="totalAmount">₹0</span>
        </div>
    </section>

    <!-- Payment Method -->
    <section class="card">
        <h2>Payment Method</h2>

        <label class="payment-option active">
            <input
                type="radio"
                name="paymentMethod"
                value="UPI"
                checked
            >
            UPI
        </label>

        <label class="payment-option">
            <input
                type="radio"
                name="paymentMethod"
                value="Cash"
            >
            Cash
        </label>
    </section>

    <div id="loading" class="loading">
        Creating your booking...
    </div>

    <button
        id="payButton"
        class="pay-btn"
        onclick="completePayment()"
    >
        Pay & Confirm Booking
    </button>

</main>


<script>

    // ========================================================
    // STORAGE KEY
    // ========================================================

    const STORAGE_KEY = "workmitraBooking";


    // ========================================================
    // HELPERS
    // ========================================================

    function getBookingData() {

        try {

            const raw = sessionStorage.getItem(STORAGE_KEY);

            if (!raw) {
                return null;
            }

            return JSON.parse(raw);

        } catch (error) {

            console.error(
                "BOOKING STORAGE ERROR:",
                error
            );

            return null;
        }
    }


    function numberValue(value, fallback = 0) {

        const number = parseFloat(value);

        if (Number.isFinite(number)) {
            return number;
        }

        return fallback;
    }


    function money(value) {

        return "₹" + numberValue(value).toFixed(0);
    }


    function firstValue(data, keys, fallback = "") {

        for (const key of keys) {

            if (
                data &&
                data[key] !== undefined &&
                data[key] !== null &&
                String(data[key]).trim() !== ""
            ) {
                return data[key];
            }
        }

        return fallback;
    }


    // ========================================================
    // LOAD BOOKING
    // ========================================================

    function loadBooking() {

        const data = getBookingData();

        if (!data) {

            showError(
                "Booking information was not found. Please start the booking again."
            );

            document.getElementById(
                "payButton"
            ).disabled = true;

            return;
        }


        const service = firstValue(
            data,
            [
                "category",
                "service",
                "serviceName",
                "service_name"
            ],
            "Service"
        );


        const date = firstValue(
            data,
            [
                "preferred_date",
                "date",
                "bookingDate"
            ],
            "-"
        );


        const time = firstValue(
            data,
            [
                "preferred_time",
                "time",
                "bookingTime"
            ],
            "-"
        );


        const address = firstValue(
            data,
            [
                "address",
                "service_address"
            ],
            "-"
        );


        const serviceFee = numberValue(
            firstValue(
                data,
                [
                    "service_charge",
                    "serviceFee",
                    "service_fee"
                ],
                99
            ),
            99
        );


        const platformFee = numberValue(
            firstValue(
                data,
                [
                    "platform_fee",
                    "platformFee"
                ],
                10
            ),
            10
        );


        let totalAmount = numberValue(
            firstValue(
                data,
                [
                    "total_amount",
                    "totalAmount"
                ],
                ""
            ),
            0
        );


        if (totalAmount <= 0) {
            totalAmount = serviceFee + platformFee;
        }


        document.getElementById(
            "serviceName"
        ).textContent = service;


        document.getElementById(
            "bookingDate"
        ).textContent = date;


        document.getElementById(
            "bookingTime"
        ).textContent = time;


        document.getElementById(
            "bookingAddress"
        ).textContent = address;


        document.getElementById(
            "serviceFee"
        ).textContent = money(serviceFee);


        document.getElementById(
            "platformFee"
        ).textContent = money(platformFee);


        document.getElementById(
            "totalAmount"
        ).textContent = money(totalAmount);


        // Keep normalized values for backend
        data.category = service;
        data.preferred_date = date;
        data.preferred_time = time;
        data.address = address;
        data.service_charge = serviceFee;
        data.platform_fee = platformFee;
        data.total_amount = totalAmount;


        sessionStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );
    }


    // ========================================================
    // PAYMENT METHOD UI
    // ========================================================

    document
        .querySelectorAll(
            'input[name="paymentMethod"]'
        )
        .forEach(function(input) {

            input.addEventListener(
                "change",
                function() {

                    document
                        .querySelectorAll(
                            ".payment-option"
                        )
                        .forEach(function(option) {

                            option.classList.remove(
                                "active"
                            );
                        });


                    input
                        .closest(".payment-option")
                        .classList.add("active");
                }
            );
        });


    // ========================================================
    // COMPLETE PAYMENT
    // ========================================================

    async function completePayment() {

        const booking = getBookingData();

        if (!booking) {

            showError(
                "Booking information is missing. Please go back and try again."
            );

            return;
        }


        const paymentMethodElement =
            document.querySelector(
                'input[name="paymentMethod"]:checked'
            );


        const paymentMethod =
            paymentMethodElement
                ? paymentMethodElement.value
                : "UPI";


        const service = firstValue(
            booking,
            [
                "category",
                "service",
                "serviceName",
                "service_name"
            ],
            ""
        );


        const address = firstValue(
            booking,
            [
                "address",
                "service_address"
            ],
            ""
        );


        if (!service) {

            showError(
                "Service information is missing."
            );

            return;
        }


        if (!address) {

            showError(
                "Service address is missing."
            );

            return;
        }


        const serviceFee = numberValue(
            firstValue(
                booking,
                [
                    "service_charge",
                    "serviceFee",
                    "service_fee"
                ],
                99
            ),
            99
        );


        const platformFee = numberValue(
            firstValue(
                booking,
                [
                    "platform_fee",
                    "platformFee"
                ],
                10
            ),
            10
        );


        let totalAmount = numberValue(
            firstValue(
                booking,
                [
                    "total_amount",
                    "totalAmount"
                ],
                ""
            ),
            0
        );


        if (totalAmount <= 0) {
            totalAmount =
                serviceFee +
                platformFee;
        }


        // ----------------------------------------------------
        // Prevent double click
        // ----------------------------------------------------

        const button =
            document.getElementById(
                "payButton"
            );

        const loading =
            document.getElementById(
                "loading"
            );


        button.disabled = true;

        button.textContent =
            "Processing...";

        loading.style.display =
            "block";


        hideError();


        // ----------------------------------------------------
        // Build backend payload
        // ----------------------------------------------------

        const payload = {

            category: service,

            service_id: firstValue(
                booking,
                [
                    "service_id",
                    "serviceId"
                ],
                ""
            ),

            description: firstValue(
                booking,
                [
                    "description",
                    "problem",
                    "details"
                ],
                ""
            ),

            address: address,

            city: firstValue(
                booking,
                [
                    "city"
                ],
                ""
            ),

            state: firstValue(
                booking,
                [
                    "state"
                ],
                ""
            ),

            pincode: firstValue(
                booking,
                [
                    "pincode",
                    "pinCode",
                    "zip"
                ],
                ""
            ),

            preferred_date: firstValue(
                booking,
                [
                    "preferred_date",
                    "date",
                    "bookingDate"
                ],
                ""
            ),

            preferred_time: firstValue(
                booking,
                [
                    "preferred_time",
                    "time",
                    "bookingTime"
                ],
                ""
            ),

            service_charge: serviceFee,

            platform_fee: platformFee,

            total_amount: totalAmount,

            payment_method: paymentMethod,

            // Demo payment confirmation.
            // Real gateway can be connected later.
            payment_id:
                "PAY-" +
                Date.now(),

            payment_status: "paid"
        };


        try {

            // ------------------------------------------------
            // CREATE DATABASE BOOKING
            // ------------------------------------------------

            const response =
                await fetch(
                    "/customer/create-booking",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "same-origin",

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );


            const result =
                await response.json();


            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "Booking could not be created."
                );
            }


            // ------------------------------------------------
            // Save REAL booking ID
            // ------------------------------------------------

            booking.booking_id =
                result.booking_id;

            booking.paymentStatus =
                "paid";

            booking.payment_status =
                "paid";

            booking.payment_method =
                paymentMethod;

            booking.payment_id =
                payload.payment_id;


            sessionStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(booking)
            );


            // ------------------------------------------------
            // REAL BOOKING SUCCESS
            // ------------------------------------------------

            window.location.href =
                "/customer/booking-success?id=" +
                encodeURIComponent(
                    result.booking_id
                );

        } catch (error) {

            console.error(
                "PAYMENT / BOOKING ERROR:",
                error
            );


            showError(
                error.message ||
                "Something went wrong while creating your booking."
            );


            button.disabled = false;

            button.textContent =
                "Pay & Confirm Booking";

            loading.style.display =
                "none";
        }
    }


    // ========================================================
    // ERROR
    // ========================================================

    function showError(message) {

        const box =
            document.getElementById(
                "errorMessage"
            );

        box.textContent = message;

        box.classList.add("error");

        box.style.display = "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    function hideError() {

        const box =
            document.getElementById(
                "errorMessage"
            );

        box.textContent = "";

        box.classList.remove("error");

        box.style.display = "none";
    }


    // ========================================================
    // BACK
    // ========================================================

    function goBack() {

        window.history.back();
    }


    // ========================================================
    // INIT
    // ========================================================

    document.addEventListener(
        "DOMContentLoaded",
        loadBooking
    );

</script>

</body>
</html>
