<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Worker Home</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#f5f7fb;
padding-bottom:90px;

}

.header{

background:linear-gradient(135deg,#2563eb,#0f172a);

color:white;

padding:30px 20px;

border-radius:0 0 25px 25px;

}

.header h2{

margin-bottom:5px;

}

.card{

margin:18px;

padding:20px;

background:white;

border-radius:18px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.card h3{

color:#2563eb;

margin-bottom:10px;

}

.value{

font-size:28px;

font-weight:bold;

margin-top:10px;

}

.grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

padding:18px;

}

.box{

background:white;

border-radius:18px;

padding:20px;

text-align:center;

box-shadow:0 5px 12px rgba(0,0,0,.08);

}

.box h4{

margin-bottom:10px;

color:#444;

}

.box p{

font-size:24px;

font-weight:bold;

color:#2563eb;

}

.bottom{

position:fixed;

bottom:0;

left:0;

width:100%;

height:70px;

background:white;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:0 -5px 15px rgba(0,0,0,.08);

}

.bottom a{

text-decoration:none;

color:#555;

font-size:14px;

text-align:center;

}

.active{

color:#2563eb;

font-weight:bold;

}

</style>

</head>

<body>

<div class="header">

<h2>

Welcome 👋

</h2>

<p>

Worker ID :
{{ session.user_id }}

</p>

</div>


<div class="card">

<h3>

Wallet Balance

</h3>

<div class="value">

₹0

</div>

</div>


<div class="grid">

<div class="box">

<h4>

Total Jobs

</h4>

<p>

0

</p>

</div>


<div class="box">

<h4>

Pending

</h4>

<p>

0

</p>

</div>


<div class="box">

<h4>

Completed

</h4>

<p>

0

</p>

</div>


<div class="box">

<h4>

Notifications

</h4>

<p>

0

</p>

</div>

</div>


<div class="bottom">

<a class="active"
href="/worker/home">

🏠<br>Home

</a>


<a href="/worker/jobs">

💼<br>Jobs

</a>


<a href="/worker/wallet">

💰<br>Wallet

</a>


<a href="/worker/profile">

👤<br>Profile

</a>

</div>

</body>
</html>
