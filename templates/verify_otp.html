<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify OTP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#2563eb,#0f172a);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:380px;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:10px;
}

p{
text-align:center;
color:#666;
margin-bottom:25px;
font-size:14px;
}

.input{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:15px;
outline:none;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<h2>Verify OTP</h2>

<p>
Enter the 6-digit OTP
</p>

<form method="POST">

<input
class="input"
type="text"
name="otp"
maxlength="6"
placeholder="Enter OTP"
required>

<button type="submit">

Verify OTP

</button>

</form>

</div>

</body>
</html>
